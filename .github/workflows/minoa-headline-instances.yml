name: MINOA Headline Instances

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "data/raw/minoa/senior/Small_Input_S.json"
      - "data/raw/minoa/senior/Medium_Input_S.json"
      - "data/raw/minoa/senior/Large_Input_S.json"
      - "tools/minoa/desktopValidator/**"
      - ".github/workflows/minoa-headline-instances.yml"
      - "requirements.txt"

jobs:
  solve-and-validate:
    name: ${{ matrix.instance }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        instance: [small, medium, large]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run optimized solver and desktop validator
        env:
          MINOA_DEPOT_BRIDGE_MIN_GAP: "999999"
        run: |
          scripts/ci/run_headline_instance.sh "${{ matrix.instance }}"
          .venv/bin/python scripts/print_final_results_table.py \
            --instance "${{ matrix.instance }}" \
            --summary-file "outputs/minoa/ci/${{ matrix.instance }}_final_summary.md"

      - name: Publish result table to summary
        if: always()
        run: |
          report="outputs/minoa/ci/${{ matrix.instance }}_report.md"
          final_summary="outputs/minoa/ci/${{ matrix.instance }}_final_summary.md"
          log="outputs/minoa/ci/${{ matrix.instance }}_search.log"
          echo "## MINOA ${{ matrix.instance }} result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Run configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Instance | \`${{ matrix.instance }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Algorithm | \`multi-start path-cover\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Builder | \`pathcover-cost\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EV mode | \`charging\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validator | \`tools/minoa/desktopValidator/desktopValidator/desktopValidator.jar\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Canonical thesis result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$final_summary" ]]; then
            cat "$final_summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No canonical result summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Independent audit result table" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No result report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Generated files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          find outputs/minoa/ci -maxdepth 1 -type f -printf "%p\n" | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$log" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Optimizer final log lines</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
            tail -80 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minoa-${{ matrix.instance }}-outputs
          path: |
            outputs/minoa/ci/*.json
            outputs/minoa/ci/*.log
            outputs/minoa/ci/*.md
          if-no-files-found: ignore

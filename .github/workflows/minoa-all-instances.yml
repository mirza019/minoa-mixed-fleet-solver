name: MINOA All Instances

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "scripts/**"
      - "data/raw/minoa/senior/**"
      - "tools/minoa/desktopValidator/**"
      - ".github/workflows/minoa-all-instances.yml"
      - "requirements.txt"

jobs:
  all-instances:
    name: Solve and validate all senior instances
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run all-instance pipeline and desktop validator
        run: scripts/ci/run_all_instances.sh

      - name: Publish result table to summary
        if: always()
        run: |
          report="outputs/minoa/ci-all/all_instances_report.md"
          manifest="outputs/minoa/ci-all/pipeline_manifest.json"
          echo "## MINOA all-instance results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow solves every available MINOA senior input, creates normalized working copies when a raw input has a small schema/syntax issue, generates output JSON schedules, and validates every input/output pair with the unchanged desktop validator." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Run configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dataset folder | \`data/raw/minoa/senior\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Main algorithm | \`multi-start path-cover\` for Small/Medium/Large |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Additional-instance algorithm | \`charging-aware path-cover\` with validator-safe repair retry |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validator | \`tools/minoa/desktopValidator/desktopValidator/desktopValidator.jar\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Generated outputs | \`outputs/minoa/ci-all\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Processed working inputs | \`data/processed/minoa/ci-all\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### How to read the table" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`Valid=yes\` means the official desktop validator accepted the generated output for that input." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`Vehicles\` is the number of utilized vehicle blocks in the output, not the total available fleet." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`EV vehicles\` and \`ICE vehicles\` count the assigned vehicle type per block." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`Charge min\`, \`Break min\`, and \`Deadhead min\` are extracted from the generated schedule." >> "$GITHUB_STEP_SUMMARY"
          echo "- The processed input copies are used only when needed; raw data and validator files remain untouched." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Validator-backed result table" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No all-instance report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Machine-readable manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$manifest" ]]; then
            echo "The artifact includes \`pipeline_manifest.json\`, which records raw inputs, processed working inputs, generated outputs, validation rows, and any input normalizations used by the pipeline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No manifest was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Generated output files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          find outputs/minoa/ci-all -maxdepth 1 -type f -printf "%p\n" | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`minoa-all-instance-outputs\` artifact from this run to inspect all output JSON files, processed working inputs, the Markdown report, and the manifest." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Processed working input files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          find data/processed/minoa/ci-all -maxdepth 1 -type f -printf "%p\n" | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all-instance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minoa-all-instance-outputs
          path: |
            outputs/minoa/ci-all/**
            data/processed/minoa/ci-all/**
          if-no-files-found: ignore

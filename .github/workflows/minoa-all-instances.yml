name: MINOA All Instances

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "scripts/**"
      - "data/raw/minoa/senior/**"
      - "tools/minoa/desktopValidator/**"
      - ".github/workflows/minoa-all-instances.yml"
      - "requirements.txt"

jobs:
  all-instances:
    name: Solve and validate all senior instances
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run all-instance pipeline and desktop validator
        run: scripts/ci/run_all_instances.sh

      - name: Publish result table to summary
        if: always()
        run: |
          report="outputs/minoa/ci-all/all_instances_report.md"
          echo "## MINOA all-instance results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No all-instance report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload all-instance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minoa-all-instance-outputs
          path: |
            outputs/minoa/ci-all/**
            data/processed/minoa/ci-all/**
          if-no-files-found: ignore

name: Final Results Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "results/final_validated_results.json"
      - "scripts/print_final_results_table.py"
      - ".github/workflows/results-check.yml"

jobs:
  final-results:
    name: Check final thesis result table
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies if present
        run: |
          if [[ -f requirements.txt ]]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Run available tests
        run: |
          if [[ -d tests ]]; then
            python -m pip install pytest
            python -m pytest
          else
            echo "No tests directory found; skipping tests."
          fi

      - name: Print and validate final result table
        run: |
          python scripts/print_final_results_table.py --summary-file final_results_summary.md
          cat final_results_summary.md
          cat final_results_summary.md >> "$GITHUB_STEP_SUMMARY"
